name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VM_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AZURE_VM_IP }} >> ~/.ssh/known_hosts

      - name: Deploy code via SSH
        shell: bash
        run: |
          ssh ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            mkdir -p ~/flask-app
            cd ~/flask-app
            rm -f app.py requirements.txt

            echo "from flask import Flask" > app.py
            echo "app = Flask(__name__)" >> app.py
            echo "@app.route('/')" >> app.py
            echo "def home():" >> app.py
            echo "    return 'Hello from Flask deployed via GitHub Actions!'" >> app.py
            echo "if __name__ == '__main__':" >> app.py
            echo "    app.run(host='0.0.0.0', port=5000)" >> app.py

            echo "flask" > requirements.txt

            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            sudo pkill -f app.py || true
            nohup venv/bin/python app.py > app.log 2>&1 &
          EOF
